<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ascension Tree Mock-up</title>
<style>
  :root {
    --bg: #0b0a09; --panel: rgba(11,10,9,.96); --border: rgba(140,87,46,.78); --accent: #d16e2b;
    --text: #d9cdb8; --muted: #8a7a66; --gold: #f2c46a; --violet: #e9e2ff; --bad: #b8452e; --ok: #7fb06a;
    --serif: "Marcellus SC", "Alegreya SC", "Cinzel", Georgia, serif;
    --sans: "IBM Plex Sans Condensed", "Roboto Condensed", "Arial Narrow", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 14px/1.35 var(--sans); overflow: hidden; }
  header { position: absolute; left: 0; right: 0; top: 0; height: 58px; display: flex; align-items: center; gap: 14px; padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--border); z-index: 5; }
  header h1 { font: 22px var(--serif); font-variant: small-caps; letter-spacing: .08em; margin: 0 6px 0 0; color: var(--gold); }
  .tabs button { background: transparent; color: var(--muted); border: 1px solid transparent; padding: 6px 12px; font: 15px var(--serif); font-variant: small-caps; letter-spacing: .06em; cursor: pointer; border-radius: 2px; }
  .tabs button.on { color: var(--text); border-color: var(--border); background: rgba(140,87,46,.12); }
  .field { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .field input[type=number], .field input[type=text] { width: 120px; background: #15120f; color: var(--text); border: 1px solid var(--border); padding: 4px 6px; font: 14px var(--sans); border-radius: 2px; }
  .field input[type=range] { width: 130px; accent-color: var(--accent); }
  .field b { color: var(--text); font-weight: 600; font-size: 13px; letter-spacing: 0; text-transform: none; }
  header button.small, aside button { background: #15120f; color: var(--text); border: 1px solid var(--border); padding: 4px 10px; font: 13px var(--sans); cursor: pointer; border-radius: 2px; }
  header button.small:hover, aside button:hover { border-color: var(--accent); }
  .mode { display: flex; border: 1px solid var(--border); border-radius: 2px; overflow: hidden; }
  .mode button { border: 0; border-radius: 0; }
  .mode button.on { background: rgba(209,110,43,.25); color: var(--gold); }
  main { position: absolute; inset: 58px 0 0 0; }
  canvas#tree { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
  canvas#tree.dragging { cursor: grabbing; }
  aside { position: absolute; top: 12px; right: 12px; width: 300px; max-height: calc(100% - 214px); overflow: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 3px; padding: 10px 12px; z-index: 4; }
  aside h2 { font: 15px var(--serif); font-variant: small-caps; letter-spacing: .08em; color: var(--gold); margin: 8px 0 6px; border-bottom: 1px solid rgba(140,87,46,.35); padding-bottom: 3px; }
  aside h2:first-child { margin-top: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { border: 1px solid rgba(140,87,46,.5); color: var(--muted); padding: 2px 8px; font-size: 12px; border-radius: 10px; cursor: pointer; user-select: none; }
  .chip.on { color: var(--text); border-color: var(--accent); background: rgba(209,110,43,.15); }
  #search { width: 100%; background: #15120f; color: var(--text); border: 1px solid var(--border); padding: 5px 8px; font: 14px var(--sans); border-radius: 2px; }
  .legend div { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin: 2px 0; }
  .legend i { display: inline-block; width: 14px; height: 14px; border: 1.5px solid var(--gold); }
  .ledger { font-size: 12px; color: var(--muted); }
  .ledger b { color: var(--text); }
  .balance-bar { height: 8px; background: #1a1613; border: 1px solid rgba(140,87,46,.5); position: relative; margin: 4px 0 6px; }
  .balance-bar .floor { position: absolute; left: 0; top: 0; bottom: 0; background: repeating-linear-gradient(45deg, rgba(184,69,46,.7) 0 3px, transparent 3px 6px); }
  .balance-bar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #a4692f, var(--gold)); }
  #log { font-size: 12px; color: var(--muted); max-height: 110px; overflow: auto; }
  #log div b { color: var(--text); }
  #debug { font: 11px/1.3 ui-monospace, monospace; color: var(--muted); max-height: 120px; overflow: auto; white-space: pre-wrap; }
  #debug .bad { color: var(--bad); }
  #debug .ok { color: var(--ok); }
  #tooltip { position: absolute; z-index: 6; pointer-events: none; width: 340px; background: var(--panel); border: 1px solid var(--border); border-radius: 3px; padding: 10px 12px; display: none; box-shadow: 0 8px 30px rgba(0,0,0,.6); }
  #tooltip h3 { margin: 0; font: 17px var(--serif); font-variant: small-caps; letter-spacing: .06em; color: var(--gold); display: flex; justify-content: space-between; }
  #tooltip .ring { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .12em; margin: 2px 0 6px; }
  #tooltip p { margin: 4px 0; }
  #tooltip .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
  #tooltip .price { color: #e08a6a; }
  #tooltip .cost { color: var(--gold); font-weight: 600; }
  #tooltip .hint { color: var(--muted); font-size: 11px; margin-top: 6px; border-top: 1px solid rgba(140,87,46,.35); padding-top: 4px; }
  #tooltip .warn { color: var(--bad); }
  #minimap { position: absolute; right: 12px; bottom: 12px; width: 180px; height: 180px; background: rgba(11,10,9,.9); border: 1px solid var(--border); z-index: 4; cursor: pointer; }
  #hud { position: absolute; left: 12px; bottom: 12px; z-index: 4; background: var(--panel); border: 1px solid var(--border); border-radius: 3px; padding: 6px 10px; font-size: 12px; color: var(--muted); max-width: 520px; }
  #hud b { color: var(--text); }
  #confirm { position: absolute; inset: 0; z-index: 7; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; }
  #confirm .box { width: 460px; background: var(--panel); border: 1px solid var(--gold); border-radius: 3px; padding: 16px 18px; }
  #confirm h3 { margin: 0 0 8px; font: 20px var(--serif); font-variant: small-caps; color: var(--gold); letter-spacing: .06em; }
  #confirm ul { margin: 6px 0 10px 18px; padding: 0; }
  #confirm .btns { display: flex; gap: 8px; justify-content: flex-end; }
  #confirm button { background: #15120f; color: var(--text); border: 1px solid var(--border); padding: 6px 14px; font: 14px var(--serif); font-variant: small-caps; cursor: pointer; }
  #confirm button.yes { border-color: var(--gold); color: var(--gold); }
  kbd { border: 1px solid rgba(140,87,46,.6); border-radius: 3px; padding: 0 4px; font: 11px ui-monospace, monospace; color: var(--text); }
</style>
</head>
<body>
<header>
  <h1>Ascension</h1>
  <div class="tabs" id="tabs"></div>
  <div class="mode" id="mode"><button data-mode="hub" class="on" title="Between segments: the full tree, refunds allowed">Hub</button><button data-mode="pulpit" title="Inside an attuned Wardstone: small, mechanic, mutation and sink nodes only">Wardstone</button></div>
  <label class="field">Segment <input type="range" id="segment" min="1" max="40" value="2"> <b id="segment-label">2</b> <b id="reach-label">reach ×1</b></label>
  <label class="field">Followers <input type="number" id="balance" value="5700" step="100"></label>
  <button class="small" id="fill" title="Set Followers to the design's expected on-hand amount at this segment">Expected on hand</button>
  <label class="field">Peak <b id="peak-label">5,700</b></label>
  <label class="field">Floor <b id="floor-label">10</b></label>
  <label class="field">Refund <b id="refund-label">50%</b></label>
  <button class="small" id="fit" title="Fit the tree to the window (F)">Fit</button>
  <button class="small" id="reset" title="Forget every purchase">Reset run</button>
</header>
<main>
  <canvas id="tree"></canvas>
  <aside>
    <h2>Search</h2>
    <input id="search" type="text" placeholder="name, effect, tag…  (/ to focus, Enter jumps)">
    <h2>Filters</h2>
    <div class="chips" id="chips"></div>
    <h2>Belief</h2>
    <div class="ledger" id="ledger"></div>
    <h2>Recent</h2>
    <div id="log"></div>
    <h2>Legend</h2>
    <div class="legend" id="legend"></div>
    <h2>Validator</h2>
    <div id="debug"></div>
    <h2>Keys</h2>
    <div class="ledger"><kbd>←↑→↓</kbd> walk nodes · <kbd>Enter</kbd> buy · <kbd>Del</kbd> renounce · <kbd>F</kbd> fit · <kbd>/</kbd> search · <kbd>Esc</kbd> clear · wheel zoom · drag pan · right-click renounce</div>
  </aside>
  <canvas id="minimap" width="180" height="180"></canvas>
  <div id="hud"></div>
  <div id="tooltip"></div>
  <div id="confirm"><div class="box"><h3 id="confirm-title">Commit</h3><div id="confirm-body"></div><div class="btns"><button id="confirm-no">Back</button><button id="confirm-yes" class="yes">Swear it</button></div></div></div>
</main>

<script>
(() => {
'use strict';
const DATA = JSON.parse(document.getElementById('tree-data').textContent);
if (!DATA.nodes) { document.getElementById('debug').textContent = 'No tree data embedded. Run tools/design/build_ascension_tree.py.'; return; }

// ---------------------------------------------------------------- constants
const RING_R = Object.fromEntries(DATA.rings.map(r => [r.index, r.radius]));
const RING_NAME = Object.fromEntries(DATA.rings.map(r => [r.index, r.name]));
const WEDGE_CENTER = [-90, 30, 150];               // subtree 0 top, 1 lower-right, 2 lower-left (clockwise)
const GUTTER_ANGLE = { 0: -30, 1: 90, 2: 210 };    // gutter i sits between subtree i and i+1
const USABLE = 100, HALF = USABLE / 2;
const RING_STROKE = { 1: '#8a7a66', 2: '#a4692f', 3: '#d16e2b', 4: '#f2c46a', 5: '#e9e2ff' };
const RING_FILL = { 1: '#1a1613', 2: '#1d1610', 3: '#20170f', 4: '#231b0f', 5: '#1a1722' };
const SIZE = { core: 34, doctrine: 12, small: 11, mechanic: 15, fork: 17, keystone: 28, active: 32, mutation: 10, capstone: 22, axiom: 20, revelation: 30, witness: 18, bridge: 22, ascendant: 30, sink: 18 };
const CONFIRM_TYPES = new Set(['keystone', 'active', 'fork', 'axiom', 'revelation', 'witness', 'bridge', 'ascendant', 'capstone']);
const PULPIT_TYPES = new Set(['small', 'mechanic', 'mutation', 'sink']);
const TYPES = ['small', 'mechanic', 'fork', 'keystone', 'active', 'mutation', 'capstone', 'axiom', 'revelation', 'witness', 'bridge', 'ascendant', 'sink'];
const GLYPH = { small: '·', mechanic: '◆', fork: '⟋', keystone: '⬡', active: '☉', mutation: '⬢', capstone: '✦', axiom: '△', revelation: '⟁', witness: '◉', bridge: '⌬', ascendant: '⧉', sink: '∞', doctrine: '○', core: '' };
const ECON = DATA.economy;

// ---------------------------------------------------------------- state
const S = {
  style: DATA.styles[0].id, mode: 'hub', segment: 2, balance: 5700, peak: 5700,
  purchased: new Map(),          // id -> {rank, paid:[...], segment}
  sealed: new Set(), refunds: 0, log: [],
  cam: { x: 0, y: 0, z: 1 }, hover: null, focus: null, drag: null,
  filters: new Set(), showPurchased: false, showAffordable: false, search: '',
  anims: [], pulses: [], spent: 0, refunded: 0,
};
const byId = new Map(DATA.nodes.map(n => [n.id, n]));
const nodesOfStyle = id => DATA.nodes.filter(n => n.style === id);
const styleMeta = id => DATA.styles.find(s => s.id === id);
const subtreeIndex = (styleId, subId) => DATA.subtree_order[styleId].indexOf(subId);
const fmt = v => v >= 1e9 ? (v / 1e9).toFixed(2) + 'B' : v >= 1e6 ? (v / 1e6).toFixed(2) + 'M' : v >= 1e4 ? Math.round(v / 1000) + 'k' : Math.round(v).toLocaleString('en-US');
const deg = a => a * Math.PI / 180;

// ---------------------------------------------------------------- economy
const reach = seg => Math.pow(ECON.reach_ratio, Math.max(0, seg - 2));
const floorCost = seg => Math.ceil((ECON.floor_base + ECON.floor_per_segment * (seg - 1)) * reach(seg));
const refundShare = seg => Math.min(0.5, Math.max(ECON.refund.floor, ECON.refund.start * Math.pow(ECON.refund.decay, seg - 2)));
const expectedOnHand = seg => { const t = ECON.on_hand_table; if (t[seg]) return t[seg]; return Math.round(6000 * reach(seg) * 1.1); };
function ownedOfClass(type) { let n = 0; for (const [id, p] of S.purchased) { const node = byId.get(id); if (node && node.type === type) n += (type === 'small' ? p.rank : 1); } return n; }
function cost(node) {
  const cls = DATA.classes[node.type]; const base = node.base_cost;
  const state = S.purchased.get(node.id);
  if (node.type === 'sink') return Math.round(base * Math.pow(node.ratio, state ? state.rank : 0));
  const n = ownedOfClass(node.type);
  if (cls.escalation === 'linear') return Math.round(base * (1 + cls.rate * n));
  if (cls.escalation === 'geometric') return Math.round(base * Math.pow(cls.rate, n));
  return base;
}
function peakGate(node) {
  const g = DATA.peak_gates;
  if (node.type === 'ascendant') return g.ascendant;
  if (node.type === 'bridge') return g.bridge;
  if (node.type === 'witness') return g.witness;
  if (node.type === 'revelation') return g.revelation;
  if (node.ring === 3 || node.ring === 4) return g.ring3;
  return 0;
}
function isOwned(id) { const n = byId.get(id); if (n && n.type === 'core') return true; if (n && n.type === 'doctrine') return S.segment >= n.segment; const p = S.purchased.get(id); return !!p && p.rank > 0; }  // rank 1 satisfies prerequisites
function isComplete(id) { const p = S.purchased.get(id); if (!p) return false; const n = byId.get(id); return n.type === 'small' ? p.rank >= (n.ranks || 1) : p.rank > 0; }
function anyRank(id) { return S.purchased.has(id); }
function subtreeCount(node) { let n = 0; for (const id of S.purchased.keys()) { const o = byId.get(id); if (o.style === node.style && o.subtree === node.subtree && o.type !== 'sink') n++; } return n; }
function prereqsMet(node) {
  const anyOk = !node.req || node.req.filter(r => isOwned(r)).length >= (node.req_min || 1);
  const allOk = (node.req_all || []).every(r => isOwned(r));
  return anyOk && allOk;
}
function status(node) {
  if (node.type === 'core') return 'core';

    S.balance -= c; S.spent += c;
    const cur = S.purchased.get(n.id) || { rank: 0, paid: [], segment: S.segment };
    cur.rank += 1; cur.paid.push(c); S.purchased.set(n.id, cur);
    for (const e of n.excl || []) S.sealed.add(e);
    S.pulses.push({ id: n.id, t0: performance.now() });
    logLine(`<b>${n.name}</b> ${n.ranks > 1 || n.type === 'sink' ? 'rank ' + cur.rank : ''} — ${fmt(c)}`);
    refresh();
  };
  if (CONFIRM_TYPES.has(n.type) || c > S.balance * 0.25) { confirmBox(`Swear ${n.name}?`, `<p>${n.effect}</p>${n.price ? `<p class="price">Price: ${n.price}</p>` : ''}${n.excl && n.excl.length ? `<p class="price">Renounces: ${n.excl.map(r => byId.get(r).name).join(', ')}</p>` : ''}<p>Cost <b>${fmt(c)}</b> Followers, leaving <b>${fmt(S.balance - c)}</b>. ${DATA.classes[n.type].permanent ? 'This can never be refunded.' : ''}</p>`, commit); return true; }
  commit(); return true;
}
function confirmPath(p) {
  const total = p.nodes.reduce((s, n) => s + cost(n), 0);
  if (S.balance - total < floorCost(S.segment)) { logLine(`<span class="warn">Path of ${p.nodes.length} would break the reconstruction floor</span>`); return false; }
  confirmBox(`Walk ${p.nodes.length} nodes?`, `<ul>${p.nodes.map(n => `<li>${n.name} <span class="cost">${fmt(cost(n))}</span></li>`).join('')}</ul><p>Total about <b>${fmt(total)}</b> (class escalation raises later steps).</p>`, () => { for (const n of p.nodes) { if (!buyImmediate(n)) break; } refresh(); });
  return true;
}
function buyImmediate(n) { const st = status(n); if (!['affordable', 'partial'].includes(st)) return false; const c = cost(n); S.balance -= c; S.spent += c; const cur = S.purchased.get(n.id) || { rank: 0, paid: [], segment: S.segment }; cur.rank += 1; cur.paid.push(c); S.purchased.set(n.id, cur); for (const e of n.excl || []) S.sealed.add(e); S.pulses.push({ id: n.id, t0: performance.now() }); logLine(`<b>${n.name}</b> — ${fmt(c)}`); return true; }
function dependants(n) { return DATA.nodes.filter(o => anyRank(o.id) && ((o.req || []).includes(n.id) || (o.req_all || []).includes(n.id) || o.parent === n.id)); }
function refund(n) {
  const cls = DATA.classes[n.type]; const cur = S.purchased.get(n.id);
  if (!cur) return;
  if (S.mode !== 'hub') return logLine('<span class="warn">Refunds happen at the Hub</span>');
  if (!cls.refundable) return logLine(`<span class="warn">${n.name} is sworn; no refund</span>`);
  const deps = dependants(n).filter(o => !((o.req || []).some(r => r !== n.id && isOwned(r))));
  if (deps.length && cur.rank <= 1) return logLine(`<span class="warn">Renounce ${deps.map(d => d.name).join(', ')} first</span>`);
  const paid = cur.paid.pop(); const back = Math.round(paid * refundShare(S.segment));
  cur.rank -= 1; if (cur.rank <= 0) { S.purchased.delete(n.id); for (const e of n.excl || []) S.sealed.delete(e); }
  S.balance += back; S.refunded += back; S.refunds++;
  logLine(`Renounced <b>${n.name}</b>: +${fmt(back)} (${Math.round(refundShare(S.segment) * 100)}% of ${fmt(paid)})`);
  refresh();
}
const box = document.getElementById('confirm');
function confirmBox(title, body, yes) { document.getElementById('confirm-title').textContent = title; document.getElementById('confirm-body').innerHTML = body; box.style.display = 'flex'; document.getElementById('confirm-yes').onclick = () => { box.style.display = 'none'; yes(); }; document.getElementById('confirm-no').onclick = () => { box.style.display = 'none'; }; }
function logLine(html) { S.log.unshift(html); S.log = S.log.slice(0, 12); document.getElementById('log').innerHTML = S.log.map(l => `<div>${l}</div>`).join(''); }

// ---------------------------------------------------------------- panels
function refresh() {
  S.peak = Math.max(S.peak, S.balance);
  document.getElementById('segment-label').textContent = S.segment;
  document.getElementById('reach-label').textContent = 'reach ×' + reach(S.segment).toFixed(reach(S.segment) < 10 ? 2 : 0);
  document.getElementById('balance').value = Math.round(S.balance);
  document.getElementById('peak-label').textContent = fmt(S.peak);
  document.getElementById('floor-label').textContent = fmt(floorCost(S.segment)) + ' / 20%';
  document.getElementById('refund-label').textContent = Math.round(refundShare(S.segment) * 100) + '%';
  const owned = [...S.purchased.keys()].map(id => byId.get(id)).filter(n => n.style === S.style);
  const perSub = {}; for (const n of owned) if (n.subtree) perSub[n.subtree] = (perSub[n.subtree] || 0) + 1;
  const floor = floorCost(S.segment); const barMax = Math.max(S.balance, floor * 5, 1);
  document.getElementById('ledger').innerHTML = `<div class="balance-bar"><div class="floor" style="width:${Math.min(100, floor / barMax * 100)}%"></div><div class="fill" style="width:${Math.min(100, S.balance / barMax * 100)}%;opacity:.7"></div></div>
    <div>On hand <b>${fmt(S.balance)}</b> · peak <b>${fmt(S.peak)}</b> · expected at segment ${S.segment}: <b>${fmt(expectedOnHand(S.segment))}</b></div>
    <div>Spent on Ascension <b>${fmt(S.spent)}</b> · refunded <b>${fmt(S.refunded)}</b> · refunds ${S.refunds}</div>
    <div>Owned in ${styleMeta(S.style).name}: <b>${owned.length}</b> ${Object.entries(perSub).map(([k, v]) => `· ${k} ${v}`).join(' ')}</div>
    <div>Belief Power from peak: <b>+${(Math.min(0.30, 0.02 * Math.log2(1 + S.peak / 25)) * 100).toFixed(1)}%</b> · slotted: Q ${slotted('active')} · V ${slotted('revelation')}</div>`;
  document.getElementById('hud').innerHTML = `<b>${styleMeta(S.style).name}</b> tree · ${S.mode === 'hub' ? 'Hub: full tree, refunds allowed' : 'Wardstone: small, mechanic, mutation and sink nodes only'} · ${nodesOfStyle(S.style).length} nodes · ${S.focus ? 'focus <b>' + S.focus.name + '</b>' : 'hover a node'}`;
  dirty = true;
}
function slotted(type) { const own = [...S.purchased.keys()].map(id => byId.get(id)).filter(n => n.type === type && n.style === S.style); return own.length ? own[0].name + (own.length > 1 ? ` (+${own.length - 1} owned)` : '') : '—'; }

// header
const tabs = document.getElementById('tabs');
for (const s of DATA.styles) { const b = document.createElement('button'); b.textContent = s.name; b.style.color = s.hue; b.onclick = () => setStyle(s.id); b.dataset.id = s.id; tabs.appendChild(b); }
function setStyle(id) { S.style = id; S.hover = null; S.focus = null; LAYOUT = layout(id); [...tabs.children].forEach(b => b.classList.toggle('on', b.dataset.id === id)); validate(); refresh(); }
document.getElementById('mode').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.mode = b.dataset.mode; [...e.currentTarget.children].forEach(x => x.classList.toggle('on', x === b)); refresh(); });
document.getElementById('segment').addEventListener('input', e => { S.segment = +e.target.value; refresh(); });
document.getElementById('balance').addEventListener('change', e => { S.balance = Math.max(0, +e.target.value || 0); refresh(); });
document.getElementById('fill').onclick = () => { S.balance = expectedOnHand(S.segment); refresh(); };
document.getElementById('fit').onclick = fit;
document.getElementById('reset').onclick = () => { S.purchased.clear(); S.sealed.clear(); S.spent = 0; S.refunded = 0; S.refunds = 0; S.log = []; document.getElementById('log').innerHTML = ''; refresh(); };
// chips
const chips = document.getElementById('chips');
for (const t of TYPES.concat(['purchased', 'affordable'])) { const c = document.createElement('span'); c.className = 'chip'; c.textContent = t; c.onclick = () => { if (t === 'purchased') S.showPurchased = !S.showPurchased; else if (t === 'affordable') S.showAffordable = !S.showAffordable; else S.filters.has(t) ? S.filters.delete(t) : S.filters.add(t); c.classList.toggle('on'); dirty = true; }; chips.appendChild(c); }
document.getElementById('legend').innerHTML = TYPES.map(t => `<div><i style="border-color:${t === 'revelation' || t === 'capstone' ? '#f2c46a' : t === 'bridge' || t === 'ascendant' || t === 'witness' || t === 'sink' ? '#e9e2ff' : '#d16e2b'}"></i>${GLYPH[t]} ${t} — ${{ small: 'one conditional number, 1-3 ranks', mechanic: 'a new interaction', fork: 'A or B, the other is sealed', keystone: 'rule change with a price', active: 'the wedge\'s Q ability', mutation: 'changes the active', capstone: 'needs two mutations', axiom: 'applies across styles', revelation: 'the wedge\'s V wipe', witness: 'another style\'s core attack', bridge: 'authored hybrid rule', ascendant: 'all three styles', sink: 'repeatable, geometric' }[t]}</div>`).join('');
const searchEl = document.getElementById('search');
searchEl.addEventListener('input', () => { S.search = searchEl.value.trim(); dirty = true; });
searchEl.addEventListener('keydown', e => { if (e.key === 'Enter') { const m = nodesOfStyle(S.style).find(n => nodeVisibleByFilter(n) && n.type !== 'core'); if (m) { S.focus = m; glideTo(m); } searchEl.blur(); } if (e.key === 'Escape') { searchEl.value = ''; S.search = ''; dirty = true; searchEl.blur(); } });

// ---------------------------------------------------------------- input
canvas.addEventListener('mousemove', e => {
  if (S.drag) { S.cam.x -= (e.clientX - S.drag.x) / S.cam.z; S.cam.y -= (e.clientY - S.drag.y) / S.cam.z; S.drag = { x: e.clientX, y: e.clientY }; S.hover = null; tip.style.display = 'none'; dirty = true; return; }
  const n = hit(e.clientX, e.clientY - 58); if (n !== S.hover) { S.hover = n; dirty = true; } tooltip(n, e.clientX, e.clientY - 58);
});
canvas.addEventListener('mousedown', e => { if (e.button === 0) { S.drag = { x: e.clientX, y: e.clientY, moved: false, t: performance.now() }; canvas.classList.add('dragging'); } });
window.addEventListener('mouseup', e => { if (!S.drag) return; const quick = performance.now() - S.drag.t < 250; S.drag = null; canvas.classList.remove('dragging'); if (quick && e.button === 0) { const n = hit(e.clientX, e.clientY - 58); if (n) { S.focus = n; buy(n); } } });
canvas.addEventListener('contextmenu', e => { e.preventDefault(); const n = hit(e.clientX, e.clientY - 58); if (n) refund(n); });
canvas.addEventListener('wheel', e => { e.preventDefault(); const before = toWorld(e.clientX, e.clientY - 58); S.cam.z = Math.min(2.4, Math.max(0.28, S.cam.z * (e.deltaY < 0 ? 1.12 : 1 / 1.12))); const after = toWorld(e.clientX, e.clientY - 58); S.cam.x += before.x - after.x; S.cam.y += before.y - after.y; dirty = true; }, { passive: false });
mini.addEventListener('mousedown', e => { const r = mini.getBoundingClientRect(); const s = 1760 / 180; S.cam.x = (e.clientX - r.left - 90) * s; S.cam.y = (e.clientY - r.top - 90) * s; dirty = true; });
canvas.addEventListener('mouseleave', () => { S.hover = null; tip.style.display = 'none'; dirty = true; });
window.addEventListener('keydown', e => {
  if (e.target === searchEl || box.style.display === 'flex' || e.target.tagName === 'INPUT') return;
  const dirs = { ArrowUp: -90, ArrowRight: 0, ArrowDown: 90, ArrowLeft: 180 };
  if (e.key in dirs) { e.preventDefault(); walk(dirs[e.key]); }
  else if (e.key === 'Enter' && S.focus) buy(S.focus);
  else if ((e.key === 'Delete' || e.key === 'Backspace') && S.focus) refund(S.focus);
  else if (e.key === 'f' || e.key === 'F') fit();
  else if (e.key === '/') { e.preventDefault(); searchEl.focus(); }
  else if (e.key === 'Escape') { S.focus = null; S.filters.clear(); S.showPurchased = S.showAffordable = false; [...chips.children].forEach(c => c.classList.remove('on')); dirty = true; }
  refresh();
});
function walk(dirDeg) {
  const nodes = nodesOfStyle(S.style).filter(n => nodeVisibleByFilter(n) && LAYOUT.has(n.id));
  if (!S.focus) { S.focus = byId.get(styleMeta(S.style).core); return; }
  const from = LAYOUT.get(S.focus.id); let best = null, bestScore = Infinity;
  const adj = new Set([].concat(S.focus.req || [], S.focus.req_all || [], S.focus.parent ? [S.focus.parent] : [], nodes.filter(o => (o.req || []).includes(S.focus.id) || (o.req_all || []).includes(S.focus.id) || o.parent === S.focus.id).map(o => o.id)));
  for (const n of nodes) { if (n === S.focus) continue; const p = LAYOUT.get(n.id); const dx = p.x - from.x, dy = p.y - from.y; const d = Math.hypot(dx, dy); if (!d) continue; const ang = Math.atan2(dy, dx) * 180 / Math.PI; let delta = Math.abs(((ang - dirDeg + 540) % 360) - 180); if (delta > 60) continue; let score = d / Math.max(0.15, Math.cos(deg(delta))); if (adj.has(n.id)) score *= 0.6; if (score < bestScore) { bestScore = score; best = n; } }
  if (best) { S.focus = best; const p = LAYOUT.get(best.id); const sc = toScreen(p.x, p.y); if (sc.x < 40 || sc.y < 40 || sc.x > W - 340 || sc.y > H - 40) glideTo(best); const t = toScreen(p.x, p.y); tooltip(best, t.x, t.y); }
}
function glideTo(n) { const p = LAYOUT.get(n.id); const from = { ...S.cam }; const t0 = performance.now(); S.anims.push(() => { const k = Math.min(1, (performance.now() - t0) / 300); const e = 1 - Math.pow(1 - k, 3); S.cam.x = from.x + (p.x - from.x) * e; S.cam.y = from.y + (p.y - from.y) * e; dirty = true; return k < 1; }); }

// ---------------------------------------------------------------- validator
function validate() {
  const out = []; const nodes = nodesOfStyle(S.style); const ids = new Set(nodes.map(n => n.id));
  const reach = new Set(nodes.filter(n => n.type === 'core' || n.type === 'doctrine').map(n => n.id)); let changed = true;
  while (changed) { changed = false; for (const n of nodes) { if (reach.has(n.id)) continue; const anyOk = !n.req || n.req.some(r => reach.has(r)); const allOk = (n.req_all || []).every(r => reach.has(r)); if (anyOk && allOk) { reach.add(n.id); changed = true; } } }
  for (const n of nodes) {
    if (!reach.has(n.id)) out.push(['bad', `${n.id} unreachable from the core`]);
    for (const r of [].concat(n.req || [], n.req_all || [], n.excl || [])) if (!byId.has(r)) out.push(['bad', `${n.id} references missing ${r}`]);
    for (const r of n.excl || []) if (byId.has(r) && !(byId.get(r).excl || []).includes(n.id)) out.push(['bad', `${n.id} exclusivity not symmetric with ${r}`]);
    if (n.type === 'fork') { const sib = (n.excl || []).map(x => byId.get(x)).filter(x => x && x.type === 'fork'); if (sib.length !== 1 || sib[0].ring !== n.ring || sib[0].subtree !== n.subtree) out.push(['bad', `${n.id} fork pair malformed`]); }
    if ((n.type === 'mutation' || n.type === 'capstone') && (!byId.has(n.parent) || byId.get(n.parent).type !== 'active')) out.push(['bad', `${n.id} parent is not an active`]);
    if (!DATA.classes[n.type]) out.push(['bad', `${n.id} unknown class ${n.type}`]);
    if (!LAYOUT.has(n.id)) out.push(['bad', `${n.id} has no layout position`]);
  }
  // pitch check
  const groups = new Map(); for (const n of nodes) { const p = LAYOUT.get(n.id); if (!p || !n.subtree || n.type === 'mutation') continue; const k = n.subtree + '|' + n.ring; (groups.get(k) || groups.set(k, []).get(k)).push(n); }
  for (const [k, g] of groups) { for (let i = 0; i < g.length; i++) for (let j = i + 1; j < g.length; j++) { const a = LAYOUT.get(g[i].id), b = LAYOUT.get(g[j].id); const d = Math.hypot(a.x - b.x, a.y - b.y); if (d < a.r + b.r + 6 && !(g[i].type === 'fork' && g[j].type === 'fork')) out.push(['bad', `${g[i].id} and ${g[j].id} overlap (${Math.round(d)} px) in ${k}`]); } }
  const counts = {}; for (const n of nodes) counts[n.type] = (counts[n.type] || 0) + 1;
  out.push(['ok', `${nodes.length} nodes: ` + Object.entries(counts).map(([k, v]) => `${k} ${v}`).join(', ')]);
  if (!out.some(o => o[0] === 'bad')) out.unshift(['ok', 'tree valid: reachable, symmetric forks, parents resolved, no overlaps']);
  document.getElementById('debug').innerHTML = out.map(([c, m]) => `<div class="${c}">${c === 'bad' ? '✗ ' : '✓ '}${m}</div>`).join('');
}

// ---------------------------------------------------------------- hash params for screenshots: #style=ranged&seg=20&balance=1500000&buy=a,b&focus=id&zoom=1.4&mode=pulpit
function applyHash() {
  const h = new URLSearchParams(location.hash.replace(/^#/, ''));
  if (h.get('style')) S.style = h.get('style');
  if (h.get('seg')) S.segment = +h.get('seg'); document.getElementById('segment').value = S.segment;
  if (h.get('balance')) S.balance = +h.get('balance'); S.peak = Math.max(S.peak, S.balance);
  if (h.get('peak')) S.peak = +h.get('peak');
  if (h.get('mode')) { S.mode = h.get('mode'); [...document.getElementById('mode').children].forEach(x => x.classList.toggle('on', x.dataset.mode === S.mode)); }
  setStyle(S.style);
  if (h.get('buy')) for (const id of h.get('buy').split(',')) { const n = byId.get(id); if (!n) continue; const ranks = n.type === 'small' ? (n.ranks || 1) : 1; for (let i = 0; i < ranks; i++) { const p = pathTo(n); if (p.total === Infinity) break; for (const x of p.nodes) buyImmediate(x); } }
  if (h.get('zoom')) S.cam.z = +h.get('zoom');
  if (h.get('focus')) { const n = byId.get(h.get('focus')); if (n) { S.focus = n; const p = LAYOUT.get(n.id); S.cam.x = p.x; S.cam.y = p.y; S.hover = n; } }
  refresh();
  if (S.hover) { const p = toScreen(LAYOUT.get(S.hover.id).x, LAYOUT.get(S.hover.id).y); tooltip(S.hover, p.x, p.y); }
}

// ---------------------------------------------------------------- boot + loop
resize(); fit(); LAYOUT = layout(S.style); setStyle(S.style); try { applyHash(); } catch (err) { document.getElementById('debug').insertAdjacentHTML('afterbegin', `<div class="bad">✗ hash error: ${err.message}</div>`); } if (!location.hash.includes('zoom')) fit();
window.addEventListener('hashchange', applyHash);
window.addEventListener('error', e => { document.getElementById('debug').insertAdjacentHTML('afterbegin', `<div class="bad">✗ script error: ${e.message} (${e.lineno})</div>`); });
function loop() { S.anims = S.anims.filter(fn => fn()); const breathing = nodesOfStyle(S.style).some(n => ['affordable', 'partial'].includes(status(n))); if (dirty || S.pulses.length || S.anims.length || breathing) draw(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
})();
</script>
</body>
